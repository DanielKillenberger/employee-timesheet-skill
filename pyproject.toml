[project]
name = "employee-timesheet"
version = "0.1.0"
description = "Monthly employee timesheet skill: generate blank sheets, validate filled-in hours, compute gross pay."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pypdf>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
